; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	BOARD_GUITION_JC8048W550N_I

[env]
framework = arduino
platform = espressif32
platform_packages = 
	platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
	platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
monitor_speed = 115200
lib_deps = 
	https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
	https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
	https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
	https://github.com/lvgl/lvgl.git#v8.4.0
	256dpi/MQTT@^2.5.2
	arduino-libraries/NTPClient@^3.2.1
	adafruit/Adafruit MAX1704X@^1.0.3
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit SHT4x Library@^1.0.5
	adafruit/Adafruit PCF8574@^1.1.2
	adafruit/Adafruit VEML7700 Library@^2.1.6
	ropg/ezTime@^0.8.3
	https://github.com/jahrulnr/esp32-speaker.git
	bblanchon/ArduinoJson@^7.4.3
	me-no-dev/ESPAsyncWebServer@^3.6.0
extra_scripts = 
    pre:test/generatedefs.py

[common]
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-I src
	-I lib
	-I include

[env:BOARD_GUITION_JC8048W550N_I]
build_flags = 
	${common.build_flags}
board = BOARD_GUITION_JC8048W550N_I
build_type = debug
monitor_filters = esp32_exception_decoder
