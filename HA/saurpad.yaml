blueprint:
  name: saur'pad
  domain: automation
  author: cupboard_
  homeassistant:
    min_version: 2026.10.0
  input:
    extra_device:
      name: devices
      description: these devices will be tracked and shown on saur'pad
      selector:
        entity:
          multiple: true

triggers:
  - trigger: mqtt
    options:
      topic: saurpad/+
      payload: online
    id: startup
  - event_type: state_changed
    trigger: event
    id: update
variables:
  extra_devices: !input extra_device
conditions:
  - condition: or
    conditions:
      - condition: trigger
        id:
          - startup
      - condition: and
        conditions:
          - condition: trigger
            id:
              - update
          - condition: template
            value_template: '{{ trigger.event.data.entity_id in extra_devices }}'
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - startup
        sequence:
          - repeat:
              for_each: >-
                {{ expand(extra_devices) | map(attribute='entity_id') | list |
                reject('is_state', 'unknown') | list | reject('is_state',
                'unavailable') | list }}
              sequence:
                - action: mqtt.publish
                  metadata: {}
                  data:
                    evaluate_payload: true
                    qos: '0'
                    retain: false
                    topic: homeassistant/{{repeat.item}}
                    payload: >-
                      {"state": "{{states(repeat.item, rounded=False,
                      with_unit=False)}}", "device_class": {% if
                      state_attr(repeat.item, 'device_class') is none %}""{%
                      else %}"{{state_attr(repeat.item, 'device_class')}}"{%
                      endif %}, "unit_of_measurement": {% if
                      state_attr(repeat.item, 'unit_of_measurement') is none
                      %}""{% else %}"{{state_attr(repeat.item,
                      'unit_of_measurement')}}"{% endif %}, "friendly_name": {%
                      if state_attr(repeat.item, 'friendly_name') is none %}""{%
                      else %}"{{state_attr(repeat.item, 'friendly_name')}}"{%
                      endif %}, "last_updated":
                      "{{states[repeat.item].last_updated.isoformat()}}",
                      "area_name": {% if area_name(repeat.item) is none %}""{%
                      else %}"{{area_name(repeat.item)}}"{% endif %}}
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: '0'
              retain: false
              topic: homeassistant/done
              payload: done
      - conditions:
          - condition: trigger
            id:
              - update
          - condition: template
            value_template: >-
              {{ trigger.event.data.old_state.state == "unknown" or
              trigger.event.data.old_state.state == "unavailable" }}
        sequence:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: true
              qos: '0'
              retain: false
              topic: homeassistant/{{trigger.event.data.entity_id}}
              payload: >-
                {"state": "{{states(trigger.event.data.entity_id, rounded=False,
                with_unit=False)}}", "device_class": {% if
                state_attr(trigger.event.data.entity_id, 'device_class') is none
                %}""{% else %}"{{state_attr(trigger.event.data.entity_id,
                'device_class')}}"{% endif %}, "unit_of_measurement": {% if
                state_attr(trigger.event.data.entity_id, 'unit_of_measurement')
                is none %}""{% else
                %}"{{state_attr(trigger.event.data.entity_id,
                'unit_of_measurement')}}"{% endif %}, "friendly_name": {% if
                state_attr(trigger.event.data.entity_id, 'friendly_name') is
                none %}""{% else %}"{{state_attr(trigger.event.data.entity_id,
                'friendly_name')}}"{% endif %}, "last_updated":
                "{{states[trigger.event.data.entity_id].last_updated.isoformat()}}",
                "area_name": {% if area_name(trigger.event.data.entity_id) is
                none %}""{% else
                %}"{{area_name(trigger.event.data.entity_id)}}"{% endif %}}
      - conditions:
          - condition: trigger
            id:
              - update
        sequence:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: true
              qos: '0'
              retain: false
              topic: homeassistant/{{trigger.event.data.entity_id}}
              payload: >-
                {"state": "{{states(trigger.event.data.entity_id, rounded=False,
                with_unit=False)}}", "unit_of_measurement": {% if
                state_attr(trigger.event.data.entity_id, 'unit_of_measurement')
                is none %}""{% else
                %}"{{state_attr(trigger.event.data.entity_id,
                'unit_of_measurement')}}"{% endif %}, "last_updated":
                "{{states[trigger.event.data.entity_id].last_updated.isoformat()}}"}
mode: queued